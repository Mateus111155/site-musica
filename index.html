<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Música</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎵 Meu Site de Música</h1>

    <div class="player">

        <h2>Minha Música</h2>

        <audio id="musica">
            <source src="musica.mp3" type="audio/mpeg">
        </audio>

        <button id="play">▶️ Play</button>
        <button id="pause">⏸️ Pausar</button>

        <br><br>

        <input 
            type="range" 
            id="progresso" 
            value="0"
            min="0"
            max="100"
        >

        <p id="tempo">0:00 / 0:00</p>

        <label for="volume">🔊 Volume</label>

        <input 
            type="range" 
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

    <script src="script.js"></script>

</body>

</html>
