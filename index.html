```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Música</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <!-- ================================= -->
        <!-- TÍTULO -->
        <!-- ================================= -->

        <h1>🎵 Meu Player</h1>


        <!-- ================================= -->
        <!-- PLAYER -->
        <!-- ================================= -->

        <div class="player">

            <!-- CAPA -->

            <img
                id="capa"
                src="capa1.jpg"
                alt="Capa da música"
            >


            <!-- TÍTULO DA MÚSICA -->

            <h2 id="titulo">
                Música 1
            </h2>


            <!-- ARTISTA -->

            <p id="artista">
                Artista 1
            </p>


            <!-- ÁUDIO -->

            <audio id="musica"></audio>


            <!-- CONTROLES -->

            <div class="controles">

                <button id="anterior">
                    ⏮️
                </button>

                <button id="play">
                    ▶️
                </button>

                <button id="pause">
                    ⏸️
                </button>

                <button id="proxima">
                    ⏭️
                </button>

            </div>


            <!-- ================================= -->
            <!-- BARRA DE PROGRESSO -->
            <!-- ================================= -->

            <input
                type="range"
                id="progresso"
                min="0"
                max="100"
                value="0"
            >


            <!-- TEMPO -->

            <p id="tempo">
                0:00 / 0:00
            </p>


            <!-- ================================= -->
            <!-- VOLUME -->
            <!-- ================================= -->

            <label for="volume">
                🔊 Volume
            </label>


            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <!-- ================================= -->
        <!-- PLAYLIST -->
        <!-- ================================= -->

        <div class="lista">

            <h2>
                🎶 Playlist
            </h2>


            <!-- PESQUISA -->

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Procurar música ou artista..."
            >


            <!--
                O JAVASCRIPT VAI CRIAR
                AS MÚSICAS AQUI
            -->

            <div id="lista-musicas"></div>

        </div>


        <!-- ================================= -->
        <!-- FAVORITOS -->
        <!-- ================================= -->

        <div class="lista favoritos-box">

            <h2>
                ❤️ Minhas Favoritas
            </h2>


            <!--
                O JAVASCRIPT VAI CRIAR
                OS FAVORITOS AQUI
            -->

            <div id="lista-favoritos"></div>

        </div>

    </div>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="script.js"></script>

</body>

</html>
```
