```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Música</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>🎵 Meu Player</h1>


        <!-- PLAYER -->

        <div class="player">

            <!-- CAPA DA MÚSICA -->

            <img
                id="capa"
                src="capa1.jpg"
                alt="Capa da música"
            >


            <!-- NOME DA MÚSICA -->

            <h2 id="titulo">
                Música 1
            </h2>


            <!-- NOME DO ARTISTA -->

            <p id="artista">
                Artista 1
            </p>


            <!-- ÁUDIO -->

            <audio id="musica"></audio>


            <!-- CONTROLES -->

            <div class="controles">

                <button id="anterior">
                    ⏮️
                </button>

                <button id="play">
                    ▶️
                </button>

                <button id="pause">
                    ⏸️
                </button>

                <button id="proxima">
                    ⏭️
                </button>

            </div>


            <!-- BARRA DE PROGRESSO -->

            <input
                type="range"
                id="progresso"
                value="0"
                min="0"
                max="100"
            >


            <!-- TEMPO -->

            <p id="tempo">
                0:00 / 0:00
            </p>


            <!-- VOLUME -->

            <label for="volume">
                🔊 Volume
            </label>


            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <!-- PLAYLIST -->

        <div class="lista">

            <h2>
                🎶 Playlist
            </h2>


            <!-- PESQUISA -->

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Procurar música..."
            >


            <!-- MÚSICA 1 -->

            <button
                class="musica-item"
                data-musica="0"
            >
                🎵 Música 1
            </button>


            <!-- MÚSICA 2 -->

            <button
                class="musica-item"
                data-musica="1"
            >
                🎵 Música 2
            </button>


            <!-- MÚSICA 3 -->

            <button
                class="musica-item"
                data-musica="2"
            >
                🎵 Música 3
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
```
