<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Música</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎵 Meu Site de Música</h1>

    <div class="player">

        <h2 id="titulo">Minha Música</h2>

        <audio id="musica"></audio>

        <button id="anterior">⏮️</button>

        <button id="play">▶️</button>

        <button id="pause">⏸️</button>

        <button id="proxima">⏭️</button>

        <br><br>

        <input
            type="range"
            id="progresso"
            value="0"
            min="0"
            max="100"
        >

        <p id="tempo">0:00 / 0:00</p>

        <label>🔊 Volume</label>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>


    <div class="lista">

        <h2>🎶 Minhas músicas</h2>

        <button class="musica-item" data-musica="0">
            🎵 Música 1
        </button>

        <button class="musica-item" data-musica="1">
            🎵 Música 2
        </button>

        <button class="musica-item" data-musica="2">
            🎵 Música 3
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
