```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Música</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>🎵 Meu Player</h1>


        <!-- PLAYER -->

        <div class="player">

            <img
                id="capa"
                src="capa1.jpg"
                alt="Capa da música"
            >

            <h2 id="titulo">
                Música 1
            </h2>

            <p id="artista">
                Artista 1
            </p>


            <audio id="musica"></audio>


            <!-- CONTROLES -->

            <div class="controles">

                <button id="anterior" title="Anterior">
                    ⏮️
                </button>

                <button id="play" title="Play">
                    ▶️
                </button>

                <button id="pause" title="Pausar">
                    ⏸️
                </button>

                <button id="proxima" title="Próxima">
                    ⏭️
                </button>

            </div>


            <!-- MODOS -->

            <div class="modos">

                <button
                    id="aleatorio"
                    title="Modo aleatório"
                >
                    🔀
                </button>

                <button
                    id="repetir"
                    title="Repetir música"
                >
                    🔁
                </button>

            </div>


            <!-- PROGRESSO -->

            <input
                type="range"
                id="progresso"
                min="0"
                max="100"
                value="0"
            >


            <p id="tempo">
                0:00 / 0:00
            </p>


            <!-- VOLUME -->

            <label for="volume">
                🔊 Volume
            </label>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <!-- PLAYLIST -->

        <div class="lista">

            <h2>
                🎶 Playlist
            </h2>


            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Procurar música ou artista..."
            >


            <div id="lista-musicas"></div>

        </div>


        <!-- FAVORITOS -->

        <div class="lista favoritos-box">

            <h2>
                ❤️ Minhas Favoritas
            </h2>


            <div id="lista-favoritos"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
