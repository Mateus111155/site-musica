<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site de Música</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎵 Meu Player</h1>

        <div class="player">

            <img id="capa" src="capa1.jpg" alt="Capa da música">

            <h2 id="titulo">Música 1</h2>

            <p id="artista">Artista 1</p>

            <audio id="musica"></audio>

            <div class="controles">

                <button id="anterior">⏮️</button>

                <button id="play">▶️</button>

                <button id="pause">⏸️</button>

                <button id="proxima">⏭️</button>

            </div>

            <input
                type="range"
                id="progresso"
                value="0"
                min="0"
                max="100"
            >

            <p id="tempo">0:00 / 0:00</p>

            <label>🔊 Volume</label>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <div class="lista">

            <h2>🎶 Playlist</h2>

            <button class="musica-item" data-musica="0">
                🎵 Música 1
            </button>

            <button class="musica-item" data-musica="1">
                🎵 Música 2
            </button>

            <button class="musica-item" data-musica="2">
                🎵 Música 3
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
